<text x="106" y="738" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="650" fill="#172A46"><tspan x="106" dy="0">A small seed sleeps in the soil.</tspan></text>
<text x="106" y="820" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="650" fill="#172A46"><tspan x="106" dy="0">Rain comes. The seed wakes up.</tspan></text>
<text x="106" y="902" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="650" fill="#172A46"><tspan x="106" dy="0">The sun shines. A green stem grows.</tspan></text>
<text x="106" y="984" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="650" fill="#172A46"><tspan x="106" dy="0">At last, a yellow flower smiles.</tspan></text>
