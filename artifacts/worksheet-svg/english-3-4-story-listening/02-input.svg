<text x="100" y="1334" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="600" fill="#172A46"><tspan x="100" dy="0">제목과 낱말 단서를 먼저 보고, 문장을 소리 내어 두 번 읽으세요.</tspan></text>
