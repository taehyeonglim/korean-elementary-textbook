<text x="72" y="108" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="38" font-weight="800" fill="#FFF" text-anchor="start">또박또박 읽고 마음 짐작하기</text>
<text x="72" y="151" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="600" fill="#FFF" text-anchor="start">1-2학년군 · 읽기 · 표현·성찰</text>
