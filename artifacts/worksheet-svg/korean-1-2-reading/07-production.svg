<text x="100" y="444" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2E2740"><tspan x="100" dy="0">첫 번째 글을 의미가 드러나도록 띄어 소리 내어 읽어 보세요.</tspan></text>
