<text x="156" y="730" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="650" fill="#18202B"><tspan x="156" dy="0">꺾은선그래프의 기온이 월요일 18°C, 화요일</tspan><tspan x="156" dy="37">21°C, 수요일 19°C, 목요일</tspan><tspan x="156" dy="37">24°C입니다. 기온이 가장 많이 오른 때와</tspan><tspan x="156" dy="37">오른 값을 쓰세요.</tspan></text>
