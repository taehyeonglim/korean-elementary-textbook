<text x="156" y="1143" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="650" fill="#18202B"><tspan x="156" dy="0">하루 동안 한 시간마다 측정한 기온이 시간에</tspan><tspan x="156" dy="37">따라 어떻게 변하는지 알아보려 합니다.</tspan><tspan x="156" dy="37">막대그래프와 꺾은선그래프 중 어느 것이 더</tspan><tspan x="156" dy="37">알맞나요?</tspan></text>
