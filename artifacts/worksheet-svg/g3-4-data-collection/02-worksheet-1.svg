<text x="156" y="317" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="650" fill="#18202B"><tspan x="156" dy="0">막대그래프에 읽은 책 수가 월요일 3권,</tspan><tspan x="156" dy="37">화요일 5권, 수요일 4권으로 나타나</tspan><tspan x="156" dy="37">있습니다. 가장 많이 읽은 요일과 책 수를</tspan><tspan x="156" dy="37">쓰세요.</tspan></text>
