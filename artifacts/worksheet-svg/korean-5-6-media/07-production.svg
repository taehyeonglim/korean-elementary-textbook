<text x="100" y="778" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#E97863" text-anchor="start">2. 쓰기</text>
<text x="100" y="824" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2E2740"><tspan x="100" dy="0">대상과 매체를 정해 안전 캠페인 한 장 자료의 구성안을 만드세요.</tspan></text>
<line x1="102" y1="900" x2="922" y2="900" stroke="#D8CEDB" stroke-width="2"/>
