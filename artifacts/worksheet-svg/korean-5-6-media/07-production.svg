<text x="100" y="1176" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">예시</text>
<text x="100" y="1223" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="650" fill="#2E2740"><tspan x="100" dy="0">대상: 1학년 / 매체: 교실 포스터 / 핵심 행동: 계단에서 걷기 / 구성: 큰 제목, 세 단계</tspan><tspan x="100" dy="30">그림, 짧은 설명, 출처</tspan></text>
