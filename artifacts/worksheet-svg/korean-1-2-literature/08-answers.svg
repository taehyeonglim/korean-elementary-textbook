<text x="96" y="1324" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="96" dy="0">예시는 한 가지 답입니다. 글의 근거를 활용하고 활동 조건에 맞게 표현했다면 알맞은 답으로 봅니다.</tspan></text>
