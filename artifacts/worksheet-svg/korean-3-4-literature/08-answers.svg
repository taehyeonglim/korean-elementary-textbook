<text x="114" y="682" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">콕콕 찌르는 듯한 느낌</tspan></text>
