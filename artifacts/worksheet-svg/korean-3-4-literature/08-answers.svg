<text x="72" y="974" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">2.</text>
<text x="114" y="974" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">제목, 마음에 든 부분, 까닭</tspan></text>
