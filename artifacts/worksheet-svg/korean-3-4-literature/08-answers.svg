<text x="114" y="506" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">바람이 창문을 두드림 → 잎이 날아옴 → 책갈피에 넣음</tspan></text>
<text x="72" y="582" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#E97863" text-anchor="start">둘째 글</text>
