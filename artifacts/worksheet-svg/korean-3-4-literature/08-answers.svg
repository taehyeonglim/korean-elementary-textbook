<text x="114" y="798" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">춥지만 즐겁고 생생하다.</tspan></text>
<text x="72" y="874" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#E97863" text-anchor="start">개념 탐구</text>
