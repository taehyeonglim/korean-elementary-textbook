<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1024 1536">
<rect width="1024" height="1536" fill="#FFFCF5"/>
<rect width="1024" height="184" fill="#62406F"/>
<text x="72" y="54" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#FFF" text-anchor="start">초등 국어 한 장</text>
<text x="72" y="108" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="38" font-weight="800" fill="#FFF" text-anchor="start">설명하고 근거로 주장하기</text>
<text x="72" y="151" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="600" fill="#FFF" text-anchor="start">5-6학년군 · 쓰기 · 정답·예시</text>
<text x="952" y="151" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#FFF" text-anchor="end">8</text>
<text x="72" y="242" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="31" font-weight="800" fill="#62406F" text-anchor="start">정답과 확인 기준</text>
<text x="72" y="290" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#E97863" text-anchor="start">첫 글</text>
<text x="72" y="332" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">1.</text>
<text x="114" y="332" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">도서관 자동 대출기</tspan></text>
<text x="72" y="390" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">2.</text>
<text x="114" y="390" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">화면 안내 → 학생증 인식 → 책 바코드 인식 → 결과 확인</tspan></text>
<text x="72" y="448" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">3.</text>
<text x="114" y="448" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">기다리는 시간을 줄인다.</tspan></text>
<text x="72" y="506" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">4.</text>
<text x="114" y="506" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">오류가 나면 사서에게 도움을 요청한다.</tspan></text>
<text x="72" y="582" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#E97863" text-anchor="start">둘째 글</text>
<text x="72" y="624" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">1.</text>
<text x="114" y="624" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">개인 물병 사용을 늘려야 한다.</tspan></text>
<text x="72" y="682" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">2.</text>
<text x="114" y="682" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">일주일에 일회용 컵 86개 사용</tspan></text>
<text x="72" y="740" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">3.</text>
<text x="114" y="740" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">6학년 2반 생활 조사표</tspan></text>
<text x="72" y="798" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">4.</text>
<text x="114" y="798" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">근거의 출처와 신뢰성을 확인하게 하려고</tspan></text>
<text x="72" y="874" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#E97863" text-anchor="start">개념 탐구</text>
<text x="72" y="916" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">1.</text>
<text x="114" y="916" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">대상의 특성과 독자에게 필요한 정보</tspan></text>
<text x="72" y="974" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">2.</text>
<text x="114" y="974" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">주장과 관련 있고 믿을 만해야 한다.</tspan></text>
<text x="72" y="1032" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">3.</text>
<text x="114" y="1032" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">주제의 통일성, 문단 순서, 표현</tspan></text>
<text x="72" y="1090" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">4.</text>
<text x="114" y="1090" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="114" dy="0">독자, 매체, 개인정보, 출처</tspan></text>
<rect x="72" y="1245" width="880" height="140" rx="18" fill="#FFF0D5"/>
<text x="96" y="1285" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="800" fill="#62406F" text-anchor="start">표현 활동</text>
<text x="96" y="1324" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="600" fill="#2E2740"><tspan x="96" dy="0">예시는 한 가지 답입니다. 글의 근거를 활용하고 활동 조건에 맞게 표현했다면 알맞은 답으로 봅니다.</tspan></text>
