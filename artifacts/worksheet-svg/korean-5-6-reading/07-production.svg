<text x="100" y="824" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2E2740"><tspan x="100" dy="0">두 관점을 비교한 뒤 가장 타당한 해결안을 근거와 함께 쓰세요.</tspan></text>
