<text x="100" y="1176" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">예시</text>
<text x="100" y="1223" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="650" fill="#2E2740"><tspan x="100" dy="0">운동장 가장자리에 뿌리가 깊게 퍼지지 않는 나무를 심자. 경기 공간과 안전을 지키면서 그늘을 만들 수</tspan><tspan x="100" dy="30">있다.</tspan></text>
