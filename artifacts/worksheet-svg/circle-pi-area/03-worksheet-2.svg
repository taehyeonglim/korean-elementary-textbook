<text x="156" y="1143" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="650" fill="#18202B"><tspan x="156" dy="0">원주율은 3.14로 계산하세요. 한 변이</tspan><tspan x="156" dy="37">14cm인 정사각형 안에 가장 큰 원을</tspan><tspan x="156" dy="37">그렸습니다. 정사각형에서 원을 뺀 부분의</tspan><tspan x="156" dy="37">넓이를 구하세요.</tspan></text>
