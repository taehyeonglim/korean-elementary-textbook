<text x="72" y="152" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start" >5-6학년군 · 문제 · 원주율은 3.14로 계산하세요.</text>
