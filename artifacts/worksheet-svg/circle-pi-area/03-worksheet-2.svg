<text x="156" y="730" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="650" fill="#18202B"><tspan x="156" dy="0">원주율은 3.14로 계산하세요. 반지름이</tspan><tspan x="156" dy="37">5m인 원형 트랙을 3바퀴 돌았습니다. 이동한</tspan><tspan x="156" dy="37">거리를 구하세요.</tspan></text>
