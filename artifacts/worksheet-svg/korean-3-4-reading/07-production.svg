<text x="72" y="54" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#FFF" text-anchor="start">초등 국어 한 장</text>
<text x="72" y="108" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="38" font-weight="800" fill="#FFF" text-anchor="start">중심 생각과 믿을 만한 출처</text>
<text x="72" y="151" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="600" fill="#FFF" text-anchor="start">3-4학년군 · 읽기 · 표현·성찰</text>
<text x="952" y="151" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#FFF" text-anchor="end">7</text>
<text x="72" y="242" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#E97863" text-anchor="start">APPLY &amp; REFLECT</text>
<text x="72" y="286" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="29" font-weight="800" fill="#62406F" text-anchor="start">읽고 생각한 내용을 나의 말과 글로 표현하세요.</text>
<rect x="72" y="350" width="880" height="330" rx="24" fill="#E1F0EA" stroke="#D8CEDB" stroke-width="2"/>
<text x="100" y="398" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#E97863" text-anchor="start">1. 말하기</text>
<text x="100" y="444" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2E2740"><tspan x="100" dy="0">첫 글을 문단별 중심 문장으로 간추리세요.</tspan></text>
<line x1="102" y1="520" x2="922" y2="520" stroke="#D8CEDB" stroke-width="2"/>
<line x1="102" y1="552" x2="922" y2="552" stroke="#D8CEDB" stroke-width="2"/>
