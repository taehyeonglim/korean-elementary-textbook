<line x1="102" y1="996" x2="922" y2="996" stroke="#D8CEDB" stroke-width="2"/>
<line x1="102" y1="1028" x2="922" y2="1028" stroke="#D8CEDB" stroke-width="2"/>
<rect x="72" y="1130" width="880" height="235" rx="22" fill="#FFF0D5"/>
<text x="100" y="1176" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#62406F" text-anchor="start">예시</text>
<text x="100" y="1223" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="650" fill="#2E2740"><tspan x="100" dy="0">누가 만들었는가? 언제 작성했는가? 근거와 출처가 제시되었는가? 다른 자료와 내용이 맞는가?</tspan></text>
