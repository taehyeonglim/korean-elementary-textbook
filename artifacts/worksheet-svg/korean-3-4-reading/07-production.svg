<line x1="102" y1="616" x2="922" y2="616" stroke="#D8CEDB" stroke-width="2"/>
<line x1="102" y1="648" x2="922" y2="648" stroke="#D8CEDB" stroke-width="2"/>
<rect x="72" y="730" width="880" height="330" rx="24" fill="#FFF" stroke="#D8CEDB" stroke-width="2"/>
<text x="100" y="778" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#E97863" text-anchor="start">2. 쓰기</text>
<text x="100" y="824" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2E2740"><tspan x="100" dy="0">인터넷 자료 하나를 정해 출처의 신뢰성을 점검하는 질문을 만드세요.</tspan></text>
